name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check project conventions (no var)
        run: ./scripts/check-no-var.sh

      - name: Build and run unit tests
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress clean verify > maven-build.log 2>&1
          build_status=$?
          if [ "$build_status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::${line//$'\n'/ }"
            done < <(grep -E '^\[ERROR\]' maven-build.log | head -n 10)
          fi
          tail -n 40 maven-build.log
          exit "$build_status"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
