spring.application.name=tournament_service
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tournament_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:2006}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Логирование (лабораторная работа №4) ---
# Файл лога: logs/tournament.log. Формат, уровни и прокрутка заданы в logback-spring.xml.
logging.file.name=logs/tournament.log
